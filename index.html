<script>
async function askTutor() {
  const questionInput = document.getElementById("question");
  const answer = document.getElementById("answer");
  const button = document.querySelector("#ai button");

  const question = questionInput.value.trim();

  if (!question) {
    answer.style.display = "block";
    answer.textContent = "Please enter a Physics question first.";
    return;
  }

  answer.style.display = "block";
  answer.textContent = "🤖 PhysicsPathAI is solving your question...";

  button.disabled = true;
  button.textContent = "Please wait...";

  try {
    const response = await fetch("/api/ask-tutor", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question: question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to get an answer. Please try again."
      );
    }

    answer.replaceChildren();

    const heading = document.createElement("strong");
    heading.textContent = "⚡ PhysicsPathAI Answer";
    answer.appendChild(heading);

    const explanation = document.createElement("p");
    explanation.style.whiteSpace = "pre-wrap";
    explanation.style.marginTop = "10px";
    explanation.textContent = data.answer;
    answer.appendChild(explanation);

  } catch (error) {
    answer.textContent =
      "Unable to connect to the AI Tutor. Please check your backend " +
      "deployment and API configuration, then try again.";
    console.error("PhysicsPathAI error:", error);
  } finally {
    button.disabled = false;
    button.textContent = "Ask PhysicsPathAI";
  }
}
</script>
