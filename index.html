<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysicsPathAI - AI Physics Tutor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f0f6ff;
      color: #123;
      text-align: center;
    }
    header {
      background: #0757b8;
      color: white;
      padding: 25px 10px;
    }
    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 20px;
    }
    textarea {
      width: 95%;
      height: 130px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #aaa;
    }
    button {
      background: #0757b8;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin: 12px;
    }
    #answer {
      background: white;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <h1>PhysicsPathAI 🚀</h1>
    <p>Your AI Physics Learning Partner</p>
  </header>

  <main>
    <h2>Ask a Physics Question</h2>
    <p>For CBSE, ICSE, HP Board, NEET and JEE</p>

    <textarea id="question" placeholder="Type your physics question here..."></textarea>
    <br>
    <button onclick="askQuestion()">Ask PhysicsPathAI</button>

    <div id="answer">Your answer will appear here.</div>
  </main>

  <script>
    async function askQuestion() {
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");

      if (!question) {
        answer.textContent = "Please enter a physics question.";
        return;
      }

      answer.textContent = "Thinking...";

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question})
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        answer.textContent = data.answer || "No answer received.";
      } catch (error) {
        answer.textContent =
          "The AI backend is not connected yet. Please configure the /api/ask backend.";
      }
    }
  </script>
</body>
</html>
